name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kroustille/muni
jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Tracking dependency check
        run: yarn run lint:tracking

  build:
    name: Build app
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js app
        run: yarn build

      - name: Upload Next.js build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
          include-hidden-files: true
          retention-days: 1

  unit:
    name: Unit & integration (coverage)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muni
          POSTGRES_PASSWORD: muni
          POSTGRES_DB: muni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muni -d muni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://muni:muni@localhost:5432/muni
      TEST_DATABASE_URL: postgres://muni:muni@localhost:5432/muni_test
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: Muni <ci@example.com>
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create test database
        run: |
          PGPASSWORD=muni psql -h localhost -U muni -d muni -c "CREATE DATABASE muni_test;" \
            || true

      - name: Build and run migrations
        run: yarn migrate:up

      - name: Generated DB types up to date
        run: yarn run db:codegen:check

      - name: Test coverage
        run: yarn run test:coverage

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muni
          POSTGRES_PASSWORD: muni
          POSTGRES_DB: muni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muni -d muni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://muni:muni@localhost:5432/muni
      TEST_DATABASE_URL: postgres://muni:muni@localhost:5432/muni_test
      APP_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: Muni <ci@example.com>
      CI: true
      PLAYWRIGHT_SKIP_WEBSERVER_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Verify Next.js build artifact
        run: test -f .next/BUILD_ID

      - name: Build and run migrations
        run: yarn migrate:up

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (shard)
        run: yarn playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

  docker:
    needs: [checks, build, unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
