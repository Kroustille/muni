services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: muni
      POSTGRES_PASSWORD: muni
      POSTGRES_DB: muni
    ports:
      - "5432:5432"
    volumes:
      - muni-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muni -d muni && psql -U muni -d muni_test -c 'select 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  muni-pgdata:
